<!DOCTYPE html>
<html>
<head>
    <title>Product Management System</title>
</head>

<body>

    <h1>Product Management System</h1>

    <button onclick="getProducts()">View Products</button>
    <button onclick="addProduct()">Add Product</button>
    <button onclick="updateProduct()">Update Product</button>
    <button onclick="updatePrice()">Update Product Price</button>
    <button onclick="deleteProduct()">Delete Product</button>


    <script>

        // API URL
        const url = "https://fakestoreapi.com/products";


        // 1. GET - View all products
        async function getProducts() {

            const response = await fetch(url);

            const data = await response.json();

            console.log("All Products:");
            console.log(data);
        }


        // 2. POST - Add a new product
        async function addProduct() {

            const product = {
                title: "Wireless Headphones",
                price: 1999,
                category: "electronics"
            };

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            const data = await response.json();

            console.log("Product Added:");
            console.log(data);
        }


        // 3. PUT - Completely update product ID 1
        async function updateProduct() {

            const product = {
                title: "Updated Smartphone",
                price: 25000,
                category: "electronics"
            };

            const response = await fetch(url + "/1", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            const data = await response.json();

            console.log("Product Updated:");
            console.log(data);
        }


        // 4. PATCH - Update only price of product ID 1
        async function updatePrice() {

            const response = await fetch(url + "/1", {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    price: 30000
                })
            });

            const data = await response.json();

            console.log("Price Updated:");
            console.log(data);
        }


        // 5. DELETE - Delete product ID 1
        async function deleteProduct() {

            const response = await fetch(url + "/1", {
                method: "DELETE"
            });

            const data = await response.json();

            console.log("Product Deleted:");
            console.log(data);
        }

    </script>

</body>
</html>

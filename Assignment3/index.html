<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 450px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: none;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 3px;
        }

        button {
            padding: 10px 18px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .submitBtn {
            background-color: #4CAF50;
        }

        .deleteBtn {
            background-color: #f44336;
            margin-left: 10px;
        }

        #sessionUser {
            margin-top: 20px;
            color: green;
            font-weight: bold;
        }

        #storedData {
            margin-top: 15px;
            background: #eef;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Feedback Form</h2>

    <form id="feedbackForm">

        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <div class="error" id="nameError"></div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <div class="error" id="emailError"></div>

        <label for="course">Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option value="C++">C++</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="JavaScript">JavaScript</option>
        </select>
        <div class="error" id="courseError"></div>

        <label for="feedback">Feedback</label>
        <textarea id="feedback" rows="5" placeholder="Enter your feedback"></textarea>
        <div class="error" id="feedbackError"></div>

        <button type="submit" class="submitBtn">Submit Feedback</button>
        <button type="button" id="deleteBtn" class="deleteBtn">Delete Stored Data</button>

    </form>

    <div id="sessionUser"></div>

    <div id="storedData">
        No feedback stored.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            padding:30px;
        }

        .container{
            background:white;
            width:500px;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        textarea{
            resize:none;
        }

        .error{
            color:red;
            font-size:13px;
            margin-top:5px;
        }

        button{
            padding:10px 18px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            color:white;
            margin-top:10px;
        }

        .submitBtn{
            background:grey;
        }

        .deleteBtn{
            background:grey;
            margin-left:10px;
        }

        #storedData{
            margin-top:20px;
            background:#eef;
            padding:15px;
            border-radius:8px;
        }

        #sessionUser{
            margin-top:20px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Feedback Form</h2>

    <form id="feedbackForm">

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="name">
            <div class="error" id="nameError"></div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
            <div class="error" id="emailError"></div>
        </div>

        <div class="form-group">
            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option>C++</option>
                <option>Java</option>
                <option>Python</option>
                <option>JavaScript</option>
            </select>
            <div class="error" id="courseError"></div>
        </div>

        <div class="form-group">
            <label>Feedback</label>
            <textarea id="feedback" rows="5"></textarea>
            <div class="error" id="feedbackError"></div>
        </div>

        <button type="submit" class="submitBtn">Submit Feedback</button>
        <button type="button" class="deleteBtn" id="deleteBtn">Delete Stored Data</button>

    </form>

    <div id="sessionUser"></div>

    <div id="storedData">
        No feedback stored.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
